name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mrsiprep/**"
      - "pyproject.toml"
      - ".gitignore"
      - ".readthedocs.yaml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mrsiprep/**"
      - "pyproject.toml"
      - ".gitignore"
      - ".readthedocs.yaml"
      - ".github/workflows/docs.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install documentation dependencies
        run: python -m pip install -r docs/requirements.txt
      - name: Build documentation with warnings treated as errors
        run: python -m sphinx -b html -j auto -W --keep-going docs docs/_build/html
